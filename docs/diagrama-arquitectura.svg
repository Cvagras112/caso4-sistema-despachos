<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4A4458"/>
    </marker>
    <marker id="flecha-mqtt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 0,8 z" fill="#6C4CE0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#FBFAFE"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1D1B20">Arquitectura · Caso 4 — Sistema de despachos (MQTT)</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#5B5766">Central (Aplicación A) ⇄ Broker MQTT (Mosquitto) ⇄ Repartidor (Aplicación B) · tópicos por zona · QoS 1</text>

  <!-- ===== Cajas principales ===== -->
  <g>
    <rect x="50" y="150" width="210" height="110" rx="12" fill="#EDE9FB" stroke="#6C4CE0" stroke-width="2"/>
    <text x="155" y="185" text-anchor="middle" font-size="17" font-weight="bold" fill="#3F2FA8">App Central</text>
    <text x="155" y="205" text-anchor="middle" font-size="12" fill="#4A4458">Aplicación A (administrador)</text>
    <text x="155" y="223" text-anchor="middle" font-size="12" fill="#4A4458">Crea y publica despachos,</text>
    <text x="155" y="238" text-anchor="middle" font-size="12" fill="#4A4458">visualiza estados</text>

    <rect x="375" y="150" width="210" height="110" rx="12" fill="#FFF7E6" stroke="#F59E0B" stroke-width="2"/>
    <text x="480" y="185" text-anchor="middle" font-size="17" font-weight="bold" fill="#8A6100">Broker MQTT</text>
    <text x="480" y="205" text-anchor="middle" font-size="12" fill="#8A6100">Mosquitto · host:1883</text>
    <text x="480" y="223" text-anchor="middle" font-size="12" fill="#8A6100">Tópicos por zona</text>
    <text x="480" y="238" text-anchor="middle" font-size="12" fill="#8A6100">despachos/puerto-montt/*</text>

    <rect x="700" y="150" width="210" height="110" rx="12" fill="#E6F6EE" stroke="#2E7D5B" stroke-width="2"/>
    <text x="805" y="185" text-anchor="middle" font-size="17" font-weight="bold" fill="#1B5E40">App Repartidor</text>
    <text x="805" y="205" text-anchor="middle" font-size="12" fill="#33534A">Aplicación B (cliente)</text>
    <text x="805" y="223" text-anchor="middle" font-size="12" fill="#33534A">Elige zona, recibe despachos,</text>
    <text x="805" y="238" text-anchor="middle" font-size="12" fill="#33534A">publica cambios de estado</text>
  </g>

  <!-- ===== Flechas de despachos nuevos (ida) ===== -->
  <g>
    <line x1="260" y1="185" x2="368" y2="185" stroke="#6C4CE0" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="314" y="172" text-anchor="middle" font-size="11" fill="#3F2FA8" font-weight="bold">publish</text>
    <line x1="592" y1="185" x2="693" y2="185" stroke="#6C4CE0" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="642" y="172" text-anchor="middle" font-size="11" fill="#3F2FA8" font-weight="bold">entrega por zona</text>
    <text x="480" y="130" text-anchor="middle" font-size="12" fill="#6C4CE0" font-weight="bold">despachos/puerto-montt/{zona}/nuevos (QoS 1)</text>
    <text x="480" y="147" text-anchor="middle" font-size="11" fill="#5B5766">zona = centro | alerce | tepual · payload JSON UTF-8</text>
  </g>

  <!-- ===== Flechas de estados (vuelta) ===== -->
  <g>
    <text x="480" y="296" text-anchor="middle" font-size="12" fill="#1B5E40" font-weight="bold">despachos/{idDespacho}/estado (QoS 1)</text>
    <line x1="693" y1="278" x2="592" y2="278" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="642" y="268" text-anchor="middle" font-size="11" fill="#1B5E40" font-weight="bold">publish estado</text>
    <line x1="368" y1="278" x2="267" y2="278" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="318" y="268" text-anchor="middle" font-size="11" fill="#1B5E40" font-weight="bold">subscribe estado</text>
    <text x="155" y="300" text-anchor="middle" font-size="11" fill="#5B5766">Central: despachos/+/estado</text>
  </g>

  <!-- ===== Capa interna de cada app ===== -->
  <g font-size="11" fill="#4A4458">
    <rect x="50" y="330" width="210" height="96" rx="10" fill="#FFFFFF" stroke="#D9D3F2"/>
    <text x="62" y="350" font-size="12" font-weight="bold" fill="#3F2FA8">Capas App Central</text>
    <text x="62" y="368">· Pantallas (P-CE01…P-CE04)</text>
    <text x="62" y="384">· Repositorio en memoria</text>
    <text x="62" y="400">· GestorMqtt (Paho, hilo secundario)</text>
    <text x="62" y="416">· Prefs (host/puerto)</text>

    <rect x="700" y="330" width="210" height="96" rx="10" fill="#FFFFFF" stroke="#BFE3D2"/>
    <text x="712" y="350" font-size="12" font-weight="bold" fill="#1B5E40">Capas App Repartidor</text>
    <text x="712" y="368">· Pantallas (P-RE01…P-RE03)</text>
    <text x="712" y="384">· Repositorio en memoria</text>
    <text x="712" y="400">· GestorMqtt (Paho, hilo secundario)</text>
    <text x="712" y="416">· Prefs (broker/zona/repartidorId)</text>
  </g>

  <!-- ===== Diagrama de estados ===== -->
  <g>
    <text x="480" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#1D1B20">Diagrama de estados del despacho</text>
    <rect x="80"  y="495" width="150" height="42" rx="21" fill="#F59E0B"/>
    <rect x="300" y="495" width="150" height="42" rx="21" fill="#3B82F6"/>
    <rect x="520" y="495" width="150" height="42" rx="21" fill="#8B5CF6"/>
    <rect x="740" y="495" width="150" height="42" rx="21" fill="#22C55E"/>
    <text x="155" y="521" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">PENDIENTE</text>
    <text x="375" y="521" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ACEPTADO</text>
    <text x="595" y="521" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">EN_CAMINO</text>
    <text x="815" y="521" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ENTREGADO</text>
    <line x1="232" y1="516" x2="296" y2="516" stroke="#4A4458" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="452" y1="516" x2="516" y2="516" stroke="#4A4458" stroke-width="2" marker-end="url(#flecha)"/>
    <line x1="672" y1="516" x2="736" y2="516" stroke="#4A4458" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="264" y="508" text-anchor="middle" font-size="10" fill="#5B5766">Repartidor acepta</text>
    <text x="484" y="508" text-anchor="middle" font-size="10" fill="#5B5766">Inicia ruta</text>
    <text x="704" y="508" text-anchor="middle" font-size="10" fill="#5B5766">Confirma entrega</text>
    <text x="480" y="575" text-anchor="middle" font-size="11" fill="#5B5766">PENDIENTE lo asigna la Central al publicar · los demás estados los publica el Repartidor · ENTREGADO es final</text>
  </g>
</svg>
