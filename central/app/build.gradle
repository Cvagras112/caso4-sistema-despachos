plugins {
    id 'com.android.application'
}

// OneDrive bloquea los archivos intermedios de Gradle en esta máquina
// (los convierte en marcadores de nube); se compila fuera de la carpeta sincronizada.
// Si no usa OneDrive, puede eliminar la siguiente línea.
layout.buildDirectory = new File(System.getenv('TEMP') ?: 'build', 'build-central')

android {
    namespace 'com.proyecto.despachos.central'
    compileSdk 34

    defaultConfig {
        applicationId "com.proyecto.despachos.central"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
